<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Oro</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        margin: 0;
        background-color: #1e1e1e;
        color: #ffffff;
        position: relative;
        height: 100vh;
        overflow: hidden; /* Empêche l'apparition d'une barre de défilement */
      }
      .version-info {
        position: absolute;
        bottom: 15px;
        left: 15px;
        font-size: 14px;
        color: #888;
        background: rgba(0,0,0,0.3);
        padding: 5px 10px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <!-- Le petit texte en bas à gauche -->
    <div class="version-info" id="version">Version inconnue</div>

    <script>
      // Mettre à jour le numéro de version en bas à gauche
      try {
        const packageJson = require('./package.json');
        document.getElementById('version').innerText = 'Version ' + packageJson.version;
      } catch (e) {
        document.getElementById('version').innerText = 'Erreur version';
      }
    </script>
  </body>
</html>
