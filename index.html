<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oro — Trading</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0d0d0f;
        color: #e4e4e7;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      /* ══════════════ NAVBAR ══════════════ */
      .navbar-wrapper {
        width: 100%;
        display: flex;
        justify-content: center;
        padding: clamp(10px, 2vh, 18px) clamp(12px, 3vw, 32px);
        flex-shrink: 0;
        z-index: 100;
      }

      .navbar {
        display: flex;
        align-items: center;
        gap: clamp(2px, 0.5vw, 6px);
        width: min(94%, 780px);
        height: clamp(42px, 6vh, 54px);
        background: linear-gradient(160deg, #1c1c22 0%, #141417 100%);
        border: 1px solid rgba(255,255,255,0.07);
        border-radius: 999px;
        padding: 0 clamp(8px, 1.5vw, 14px);
        box-shadow:
          0 0 0 1px rgba(255,255,255,0.03),
          0 8px 32px rgba(0,0,0,0.55),
          inset 0 1px 0 rgba(255,255,255,0.05);
      }

      /* ── Brand ── */
      .nav-brand {
        display: flex;
        align-items: center;
        gap: 8px;
        padding-right: clamp(10px, 1.5vw, 16px);
        margin-right: clamp(4px, 0.8vw, 8px);
        border-right: 1px solid rgba(255,255,255,0.07);
        flex-shrink: 0;
      }

      .nav-brand-icon {
        width: clamp(24px, 3vw, 30px);
        height: clamp(24px, 3vw, 30px);
        background: linear-gradient(135deg, #f5c842 0%, #d4990f 100%);
        border-radius: 7px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: clamp(11px, 1.4vw, 14px);
        font-weight: 800;
        color: #0d0d0f;
        box-shadow: 0 2px 10px rgba(245,200,66,0.3);
        flex-shrink: 0;
      }

      .nav-brand-name {
        font-size: clamp(12px, 1.5vw, 15px);
        font-weight: 700;
        letter-spacing: 1.5px;
        background: linear-gradient(90deg, #f5c842, #d4990f);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      /* ── Nav items ── */
      .nav-items {
        display: flex;
        align-items: center;
        gap: clamp(2px, 0.4vw, 4px);
        flex: 1;
      }

      .nav-item {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: clamp(5px, 0.8vh, 8px) clamp(8px, 1.2vw, 16px);
        border-radius: 999px;
        font-size: clamp(11px, 1.2vw, 13.5px);
        font-weight: 500;
        color: #71717a;
        cursor: pointer;
        transition: color 0.18s ease, background 0.18s ease, border-color 0.18s ease;
        user-select: none;
        white-space: nowrap;
        border: 1px solid transparent;
        text-decoration: none;
      }

      .nav-item svg {
        flex-shrink: 0;
        transition: opacity 0.18s;
        opacity: 0.6;
      }

      /* Hide label on very small windows */
      @media (max-width: 480px) {
        .nav-label { display: none; }
        .nav-item  { padding: 6px 10px; }
      }

      .nav-item:hover {
        color: #d4d4d8;
        background: rgba(255,255,255,0.055);
        border-color: rgba(255,255,255,0.06);
      }
      .nav-item:hover svg { opacity: 1; }

      .nav-item.active {
        color: #f5c842;
        background: rgba(245,200,66,0.1);
        border-color: rgba(245,200,66,0.18);
        box-shadow: 0 0 14px rgba(245,200,66,0.07);
      }
      .nav-item.active svg { opacity: 1; }

      /* ── Right side ── */
      .nav-right {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-left: auto;
        flex-shrink: 0;
      }

      .nav-separator {
        width: 1px;
        height: 20px;
        background: rgba(255,255,255,0.07);
        flex-shrink: 0;
      }

      .market-badge {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: clamp(4px, 0.6vh, 7px) clamp(8px, 1.2vw, 13px);
        border-radius: 999px;
        font-size: clamp(10px, 1vw, 12px);
        font-weight: 600;
        color: #22c55e;
        background: rgba(34,197,94,0.08);
        border: 1px solid rgba(34,197,94,0.15);
        letter-spacing: 0.3px;
        cursor: default;
        white-space: nowrap;
      }

      .status-dot {
        width: 6px;
        height: 6px;
        background: #22c55e;
        border-radius: 50%;
        animation: pulse-dot 2s ease-in-out infinite;
        flex-shrink: 0;
      }

      @keyframes pulse-dot {
        0%,100% { opacity: 1; box-shadow: 0 0 5px #22c55e; }
        50%      { opacity: 0.5; box-shadow: 0 0 2px #22c55e; }
      }

      /* ══════════════ MAIN CONTENT ══════════════ */
      .main-content {
        flex: 1;
        width: 100%;
        min-height: 0;
        position: relative;
      }

      /* ── Panels (pages) ── */
      .panel {
        display: none;
        position: absolute;
        inset: 0;
        padding: clamp(12px, 2vw, 28px) clamp(16px, 3vw, 40px);
        overflow-y: auto;
      }
      .panel.active { display: block; }

      /* Home panel specifically for the chart */
      #panel-home {
        padding: 0; /* Remove padding for full-screen chart effect */
        overflow: hidden;
      }

      /* ══════════════ AUTH FORMS ══════════════ */
      .auth-container {
        max-width: 400px;
        margin: 60px auto;
        background: rgba(255, 255, 255, 0.03);
        padding: 32px;
        border-radius: 24px;
        border: 1px solid rgba(255, 255, 255, 0.06);
        box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      }

      .auth-title {
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 24px;
        text-align: center;
        background: linear-gradient(90deg, #f5c842, #d4990f);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .form-group {
        margin-bottom: 20px;
      }

      .form-group label {
        display: block;
        font-size: 13px;
        color: #71717a;
        margin-bottom: 8px;
      }

      .form-group input {
        width: 100%;
        background: rgba(0, 0, 0, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 12px 16px;
        border-radius: 12px;
        color: #fff;
        font-size: 14px;
        transition: border-color 0.2s;
      }

      .form-group input:focus {
        outline: none;
        border-color: #f5c842;
      }

      .auth-button {
        width: 100%;
        background: linear-gradient(135deg, #f5c842 0%, #d4990f 100%);
        color: #0d0d0f;
        border: none;
        padding: 14px;
        border-radius: 12px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.2s, opacity 0.2s;
        margin-top: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }

      .auth-button.google {
        background: #fff;
        color: #000;
        margin-top: 15px;
      }

      .auth-button:hover {
        transform: translateY(-2px);
        opacity: 0.9;
      }

      .auth-error {
        color: #ef4444;
        background: rgba(239, 68, 68, 0.1);
        padding: 10px;
        border-radius: 8px;
        font-size: 13px;
        margin-bottom: 20px;
        display: none;
        text-align: center;
        border: 1px solid rgba(239, 68, 68, 0.2);
      }

      .auth-switch {
        text-align: center;
        margin-top: 20px;
        font-size: 13px;
        color: #71717a;
      }

      .auth-switch span {
        color: #f5c842;
        cursor: pointer;
        font-weight: 600;
      }

      /* ══════════════ VERSION ══════════════ */
      .version-info {
        position: fixed;
        bottom: 12px;
        left: 14px;
        font-size: 10.5px;
        color: #3f3f46;
        background: rgba(255,255,255,0.03);
        padding: 3px 9px;
        border-radius: 6px;
        border: 1px solid rgba(255,255,255,0.04);
        letter-spacing: 0.3px;
        z-index: 200;
      }
    </style>
  </head>
  <body>

    <!-- ════════ NAVBAR ════════ -->
    <div class="navbar-wrapper" id="navbar-wrapper" style="display: none;">
      <nav class="navbar" role="navigation" aria-label="Navigation principale">

        <!-- Brand -->

        <!-- Nav items -->
          <a class="nav-item active" id="nav-home" href="#" data-panel="panel-home" onclick="navigate(this)">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9L12 2l9 7v10a1 1 0 0 1-1 1h-5v-6h-4v6H4a1 1 0 0 1-1-1V9z"/>
              </svg>
            <span class="nav-label">Home</span>
          </a>
          
          <div class="nav-separator"></div>

          <a class="nav-item" id="nav-auth" href="#" data-panel="panel-auth" onclick="navigate(this)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            <span class="nav-label" id="auth-label">Compte</span>
          </a>

      </nav>
    </div>

    <!-- ════════ PANELS ════════ -->
    <div class="main-content">
      <!-- Page Accueil avec Graphique -->
      <div class="panel" id="panel-home">
        <div id="tradingview_container" style="height: 100%; width: 100%;"></div>
      </div>

      <!-- Page Authentification -->
      <div class="panel active" id="panel-auth">
        <div class="auth-container" id="login-form">
          <h2 class="auth-title">Connexion</h2>
          <div id="login-error" class="auth-error"></div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="login-email" placeholder="votre@email.com">
          </div>
          <div class="form-group">
            <label>Mot de passe</label>
            <input type="password" id="login-password" placeholder="••••••••">
          </div>
          <button class="auth-button" onclick="handleLogin()">Se connecter</button>
          
          <div style="display: flex; align-items: center; margin: 20px 0;">
            <div style="flex: 1; height: 1px; background: rgba(255,255,255,0.1);"></div>
            <span style="padding: 0 10px; font-size: 12px; color: #71717a;">OU</span>
            <div style="flex: 1; height: 1px; background: rgba(255,255,255,0.1);"></div>
          </div>

          <button class="auth-button google" onclick="handleGoogleLogin()">
            <svg width="18" height="18" viewBox="0 0 24 24">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-1 .67-2.28 1.07-3.71 1.07-2.87 0-5.3-1.94-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.17-4.53z"/>
            </svg>
            Continuer avec Google
          </button>

          <p class="auth-switch">Pas encore de compte ? <span onclick="toggleAuthForms()">S'inscrire</span></p>
        </div>

        <div class="auth-container" id="signup-form" style="display: none;">
          <h2 class="auth-title">Inscription</h2>
          <div id="signup-error" class="auth-error"></div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="signup-email" placeholder="votre@email.com">
          </div>
          <div class="form-group">
            <label>Mot de passe</label>
            <input type="password" id="signup-password" placeholder="••••••••">
          </div>
          <button class="auth-button" onclick="handleSignUp()">Créer un compte</button>
          <p class="auth-switch">Déjà un compte ? <span onclick="toggleAuthForms()">Se connecter</span></p>
        </div>

        <div class="auth-container" id="user-profile" style="display: none; text-align: center;">
          <h2 class="auth-title">Mon Profil</h2>
          <p id="profile-email" style="margin-bottom: 20px; color: #a1a1aa;"></p>
          <button class="auth-button" style="background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2);" onclick="handleLogout()">Déconnexion</button>
        </div>
      </div>

      <div class="panel" id="panel-dashboard"></div>
      <div class="panel" id="panel-markets"></div>
      <div class="panel" id="panel-portfolio"></div>
      <div class="panel" id="panel-trade"></div>
      <div class="panel" id="panel-analyse"></div>
    </div>

    <!-- Version -->
    <div class="version-info" id="version">Oro</div>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
      const { supabase, signIn, signUp, signOut, getUser, saveLastCrypto, getLastCrypto, signInWithGoogle } = require('./supabase.js');

      let currentSymbol = 'BINANCE:BTCUSDT';
      let tvWidget = null;

      function showError(id, message) {
        const errDiv = document.getElementById(id);
        errDiv.innerText = message;
        errDiv.style.display = 'block';
        setTimeout(() => { errDiv.style.display = 'none'; }, 5000);
      }

      // Initialisation
      window.onload = async () => {
        try {
          const user = await getUser();
          updateUIForUser(user);
          
          if (user) {
            document.getElementById('navbar-wrapper').style.display = 'flex';
            navigate(document.getElementById('nav-home'));
            currentSymbol = await getLastCrypto();
            initTradingView(currentSymbol);
          } else {
            document.getElementById('navbar-wrapper').style.display = 'none';
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.getElementById('panel-auth').classList.add('active');
          }
        } catch (e) {
          console.error("Erreur d'initialisation:", e);
          showError('login-error', "Erreur de connexion à Supabase. Vérifiez votre configuration.");
        }
      };

      function initTradingView(symbol) {
        tvWidget = new TradingView.widget({
          "autosize": true,
          "symbol": symbol,
          "interval": "D",
          "timezone": "Etc/UTC",
          "theme": "dark",
          "style": "1",
          "locale": "fr",
          "toolbar_bg": "#f1f3f6",
          "enable_publishing": false,
          "allow_symbol_change": true,
          "container_id": "tradingview_container"
        });

        // Sauvegarder périodiquement le symbole actuel si l'utilisateur est connecté
        setInterval(async () => {
          const user = await getUser();
          if (user && tvWidget && tvWidget.activeChart) {
            try {
              // Note: L'API du widget TradingView est asynchrone pour récupérer le symbole
              tvWidget.onChartReady(() => {
                const newSymbol = tvWidget.symbolInterval().symbol;
                if (newSymbol && newSymbol !== currentSymbol) {
                  currentSymbol = newSymbol;
                  saveLastCrypto(currentSymbol);
                }
              });
            } catch(e) {}
          }
        }, 5000);
      }

      // Navigation
      function navigate(el) {
        event.preventDefault();
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        el.classList.add('active');
        const target = el.getAttribute('data-panel');
        if (target) document.getElementById(target).classList.add('active');
      }

      // Auth UI Toggle
      function toggleAuthForms() {
        const login = document.getElementById('login-form');
        const signup = document.getElementById('signup-form');
        if (login.style.display === 'none') {
          login.style.display = 'block';
          signup.style.display = 'none';
        } else {
          login.style.display = 'none';
          signup.style.display = 'block';
        }
      }

      function updateUIForUser(user) {
        const loginForm = document.getElementById('login-form');
        const signupForm = document.getElementById('signup-form');
        const profile = document.getElementById('user-profile');
        const authLabel = document.getElementById('auth-label');

        if (user) {
          loginForm.style.display = 'none';
          signupForm.style.display = 'none';
          profile.style.display = 'block';
          document.getElementById('profile-email').innerText = user.email;
          authLabel.innerText = user.email.split('@')[0];
        } else {
          loginForm.style.display = 'block';
          signupForm.style.display = 'none';
          profile.style.display = 'none';
          authLabel.innerText = 'Compte';
        }
      }

      // Auth Actions
      async function handleLogin() {
        const email = document.getElementById('login-email').value;
        const pass = document.getElementById('login-password').value;
        const { data, error } = await signIn(email, pass);
        if (error) showError('login-error', error.message);
        else {
          updateUIForUser(data.user);
          location.reload();
        }
      }

      async function handleSignUp() {
        const email = document.getElementById('signup-email').value;
        const pass = document.getElementById('signup-password').value;
        const { data, error } = await signUp(email, pass);
        if (error) showError('signup-error', error.message);
        else alert("Vérifiez votre email pour confirmer l'inscription !");
      }

      async function handleGoogleLogin() {
        const { data, error } = await signInWithGoogle();
        if (error) showError('login-error', error.message);
      }

      async function handleLogout() {
        const { error } = await signOut();
        if (error) alert(error.message);
        else location.reload();
      }

      // Version
      try {
        const pkg = require('./package.json');
        document.getElementById('version').innerText = 'v' + pkg.version;
      } catch(e) {}
    </script>
  </body>
</html>
