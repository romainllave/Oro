<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oro — Trading</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0d0d0f;
        color: #e4e4e7;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      /* ══════════════ NAVBAR ══════════════ */
      .navbar-wrapper {
        width: 100%;
        display: flex;
        justify-content: center;
        padding: clamp(10px, 2vh, 18px) clamp(12px, 3vw, 32px);
        flex-shrink: 0;
        z-index: 100;
      }

      .navbar {
        display: flex;
        align-items: center;
        gap: clamp(2px, 0.5vw, 6px);
        width: min(94%, 780px);
        height: clamp(42px, 6vh, 54px);
        background: linear-gradient(160deg, #1c1c22 0%, #141417 100%);
        border: 1px solid rgba(255,255,255,0.07);
        border-radius: 999px;
        padding: 0 clamp(8px, 1.5vw, 14px);
        box-shadow:
          0 0 0 1px rgba(255,255,255,0.03),
          0 8px 32px rgba(0,0,0,0.55),
          inset 0 1px 0 rgba(255,255,255,0.05);
      }

      /* ── Brand ── */
      .nav-brand {
        display: flex;
        align-items: center;
        gap: 8px;
        padding-right: clamp(10px, 1.5vw, 16px);
        margin-right: clamp(4px, 0.8vw, 8px);
        border-right: 1px solid rgba(255,255,255,0.07);
        flex-shrink: 0;
      }

      .nav-brand-icon {
        width: clamp(24px, 3vw, 30px);
        height: clamp(24px, 3vw, 30px);
        background: linear-gradient(135deg, #f5c842 0%, #d4990f 100%);
        border-radius: 7px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: clamp(11px, 1.4vw, 14px);
        font-weight: 800;
        color: #0d0d0f;
        box-shadow: 0 2px 10px rgba(245,200,66,0.3);
        flex-shrink: 0;
      }

      .nav-brand-name {
        font-size: clamp(12px, 1.5vw, 15px);
        font-weight: 700;
        letter-spacing: 1.5px;
        background: linear-gradient(90deg, #f5c842, #d4990f);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      /* ── Nav items ── */
      .nav-items {
        display: flex;
        align-items: center;
        gap: clamp(2px, 0.4vw, 4px);
        flex: 1;
      }

      .nav-item {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: clamp(5px, 0.8vh, 8px) clamp(8px, 1.2vw, 16px);
        border-radius: 999px;
        font-size: clamp(11px, 1.2vw, 13.5px);
        font-weight: 500;
        color: #71717a;
        cursor: pointer;
        transition: color 0.18s ease, background 0.18s ease, border-color 0.18s ease;
        user-select: none;
        white-space: nowrap;
        border: 1px solid transparent;
        text-decoration: none;
      }

      .nav-item svg {
        flex-shrink: 0;
        transition: opacity 0.18s;
        opacity: 0.6;
      }

      /* Hide label on very small windows */
      @media (max-width: 480px) {
        .nav-label { display: none; }
        .nav-item  { padding: 6px 10px; }
      }

      .nav-item:hover {
        color: #d4d4d8;
        background: rgba(255,255,255,0.055);
        border-color: rgba(255,255,255,0.06);
      }
      .nav-item:hover svg { opacity: 1; }

      .nav-item.active {
        color: #f5c842;
        background: rgba(245,200,66,0.1);
        border-color: rgba(245,200,66,0.18);
        box-shadow: 0 0 14px rgba(245,200,66,0.07);
      }
      .nav-item.active svg { opacity: 1; }

      /* ── Right side ── */
      .nav-right {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-left: auto;
        flex-shrink: 0;
      }

      .nav-separator {
        width: 1px;
        height: 20px;
        background: rgba(255,255,255,0.07);
        flex-shrink: 0;
      }

      .market-badge {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: clamp(4px, 0.6vh, 7px) clamp(8px, 1.2vw, 13px);
        border-radius: 999px;
        font-size: clamp(10px, 1vw, 12px);
        font-weight: 600;
        color: #22c55e;
        background: rgba(34,197,94,0.08);
        border: 1px solid rgba(34,197,94,0.15);
        letter-spacing: 0.3px;
        cursor: default;
        white-space: nowrap;
      }

      .status-dot {
        width: 6px;
        height: 6px;
        background: #22c55e;
        border-radius: 50%;
        animation: pulse-dot 2s ease-in-out infinite;
        flex-shrink: 0;
      }

      @keyframes pulse-dot {
        0%,100% { opacity: 1; box-shadow: 0 0 5px #22c55e; }
        50%      { opacity: 0.5; box-shadow: 0 0 2px #22c55e; }
      }

      /* ══════════════ MAIN CONTENT ══════════════ */
      .main-content {
        flex: 1;
        width: 100%;
        min-height: 0;
        position: relative;
      }

      /* ── Panels (pages) ── */
      .panel {
        display: none;
        position: absolute;
        inset: 0;
        padding: clamp(12px, 2vw, 28px) clamp(16px, 3vw, 40px);
        overflow-y: auto;
      }
      .panel.active { display: block; }

      /* ══════════════ VERSION ══════════════ */
      .version-info {
        position: fixed;
        bottom: 12px;
        left: 14px;
        font-size: 10.5px;
        color: #3f3f46;
        background: rgba(255,255,255,0.03);
        padding: 3px 9px;
        border-radius: 6px;
        border: 1px solid rgba(255,255,255,0.04);
        letter-spacing: 0.3px;
        z-index: 200;
      }
    </style>
  </head>
  <body>

    <!-- ════════ NAVBAR ════════ -->
    <div class="navbar-wrapper">
      <nav class="navbar" role="navigation" aria-label="Navigation principale">

        <!-- Brand -->
        <div class="nav-brand">
          <div class="nav-brand-icon">O</div>
          <span class="nav-brand-name">ORO</span>
        </div>

        <!-- Nav items -->
        <div class="nav-items">

          <a class="nav-item active" id="nav-dashboard" href="#" data-panel="panel-dashboard" onclick="navigate(this)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
              <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
            </svg>
            <span class="nav-label">Dashboard</span>
          </a>

          <a class="nav-item" id="nav-markets" href="#" data-panel="panel-markets" onclick="navigate(this)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/>
              <polyline points="16 7 22 7 22 13"/>
            </svg>
            <span class="nav-label">Marchés</span>
          </a>

          <a class="nav-item" id="nav-portfolio" href="#" data-panel="panel-portfolio" onclick="navigate(this)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 16V8a2 2 0 0 0-1-1.73L13 2.27a2 2 0 0 0-2 0L4 6.27A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73L11 21.73a2 2 0 0 0 2 0L20 17.73A2 2 0 0 0 21 16z"/>
            </svg>
            <span class="nav-label">Portfolio</span>
          </a>

          <a class="nav-item" id="nav-trade" href="#" data-panel="panel-trade" onclick="navigate(this)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="1" x2="12" y2="23"/>
              <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
            </svg>
            <span class="nav-label">Trader</span>
          </a>

          <a class="nav-item" id="nav-analyse" href="#" data-panel="panel-analyse" onclick="navigate(this)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="20" x2="18" y2="10"/>
              <line x1="12" y1="20" x2="12" y2="4"/>
              <line x1="6"  y1="20" x2="6"  y2="14"/>
            </svg>
            <span class="nav-label">Analyse</span>
          </a>

        </div>

        <!-- Right: status -->
        <div class="nav-right">
          <div class="nav-separator"></div>
          <div class="market-badge">
            <div class="status-dot"></div>
            <span class="nav-label">Ouvert</span>
          </div>
        </div>

      </nav>
    </div>

    <!-- ════════ PANELS ════════ -->
    <div class="main-content">
      <div class="panel active" id="panel-dashboard"></div>
      <div class="panel" id="panel-markets"></div>
      <div class="panel" id="panel-portfolio"></div>
      <div class="panel" id="panel-trade"></div>
      <div class="panel" id="panel-analyse"></div>
    </div>

    <!-- Version -->
    <div class="version-info" id="version">Oro</div>

    <script>
      // Navigation
      function navigate(el) {
        event.preventDefault();
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        el.classList.add('active');
        const target = el.getAttribute('data-panel');
        if (target) document.getElementById(target).classList.add('active');
      }

      // Version
      try {
        const pkg = require('./package.json');
        document.getElementById('version').innerText = 'v' + pkg.version;
      } catch(e) {}
    </script>
  </body>
</html>
