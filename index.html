<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f8fafc; /* Fond clair professionnel (slate-50) */
      color: #0f172a; /* Texte foncé (slate-900) */
      overflow: hidden; /* Empêche le scroll global */
    }

    .layout {
      display: flex;
      height: 100vh;
      width: 100vw;
    }

    /* ════════ SIDEBAR ════════ */
    .sidebar {
      width: 72px; /* Rétractée par défaut */
      height: 100%;
      background: #ffffff;
      border-right: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 10;
      box-shadow: 2px 0 8px rgba(0,0,0,0.02);
    }

    .sidebar:hover {
      width: 260px; /* Déroulée au survol */
    }

    .sidebar-header {
      height: 72px;
      display: flex;
      align-items: center;
      padding: 0 20px;
      white-space: nowrap;
      overflow: hidden;
      border-bottom: 1px solid #f1f5f9;
      flex-shrink: 0;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      border-radius: 8px;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
      flex-shrink: 0;
      box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2);
    }

    .logo-text {
      margin-left: 16px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #0f172a;
      opacity: 0;
      transform: translateX(-10px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .sidebar:hover .logo-text {
      opacity: 1;
      transform: translateX(0);
    }

    .nav-items {
      flex: 1;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      height: 44px;
      padding: 0 14px;
      border-radius: 10px;
      text-decoration: none;
      color: #64748b; /* slate-500 */
      white-space: nowrap;
      overflow: hidden;
      transition: background 0.2s ease, color 0.2s ease;
      cursor: pointer;
    }

    .nav-icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .nav-text {
      margin-left: 16px;
      font-weight: 500;
      font-size: 14px;
      opacity: 0;
      transform: translateX(-10px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .sidebar:hover .nav-text {
      opacity: 1;
      transform: translateX(0);
    }

    .nav-item.active {
      background: #eff6ff; /* blue-50 */
      color: #2563eb; /* blue-600 */
      font-weight: 600;
    }

    .nav-item:hover:not(.active) {
      background: #f8fafc;
      color: #0f172a;
    }

    /* ════════ MAIN CONTENT ════════ */
    .main-content {
      flex: 1;
      padding: 32px 40px;
      overflow-y: auto;
    }

    .header-section {
      margin-bottom: 24px;
    }

    .page-title {
      font-size: 24px;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.5px;
    }

    .page-subtitle {
      font-size: 14px;
      color: #64748b;
      margin-top: 4px;
    }

    /* Bouton Fullscreen */
    .icon-btn {
      background: transparent;
      border: none;
      color: #64748b;
      cursor: pointer;
      padding: 6px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, color 0.2s;
      margin-left: 8px;
    }
    .icon-btn:hover {
      background: #e2e8f0;
      color: #0f172a;
    }

    /* Mode plein écran pour le widget */
    .widget-chart {
      display: flex;
      flex-direction: column;
      height: 480px;
    }

    .widget-chart.fullscreen-mode {
      position: fixed;
      inset: 0;
      z-index: 1000;
      border-radius: 0;
      margin: 0;
      height: 100vh !important;
      width: 100vw !important;
      padding: 32px 40px;
    }

    /* ════════ DASHBOARD GRID ════════ */
    .widgets-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 24px;
    }

    @media (max-width: 1024px) {
      .widgets-grid {
        grid-template-columns: 1fr;
      }
    }

    /* ════════ CARDS ════════ */
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px -2px rgba(0, 0, 0, 0.02);
    }

    .card-title {
      font-size: 16px;
      font-weight: 600;
      color: #0f172a;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-title svg {
      color: #3b82f6;
    }

    .chart-container {
      position: relative;
      flex: 1;
      min-height: 0;
      width: 100%;
      margin-top: 16px;
    }

    .chart-price-display {
      font-size: 28px;
      font-weight: 700;
      color: #0f172a;
      margin-top: -8px;
      margin-bottom: 16px;
    }

    .live-badge {
      margin-left: auto;
      font-size: 11px;
      font-weight: 500;
      color: #64748b;
      background: #f1f5f9;
      padding: 4px 8px;
      border-radius: 6px;
    }

    #messages {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      line-height: 1.6;
      color: #475569; /* slate-600 */
      background: #f8fafc;
      padding: 16px;
      border-radius: 8px;
      border: 1px solid #f1f5f9;
      max-height: 300px;
      overflow-y: auto;
    }
    
    .status-badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      background: #dcfce7; /* green-100 */
      color: #166534; /* green-800 */
      margin-top: 16px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #22c55e;
      margin-right: 6px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); }
      70% { box-shadow: 0 0 0 4px rgba(34, 197, 94, 0); }
      100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
    }
  </style>
</head>
<body>

  <div class="layout">
    
    <!-- BARRE DE NAVIGATION GAUCHE -->
    <nav class="sidebar">
      <div class="sidebar-header">
        <div class="logo-icon">O</div>
        <span class="logo-text">Oro</span>
      </div>

      <div class="nav-items">
        <a href="#" class="nav-item active">
          <!-- Icône Home (Heroicons) -->
          <svg class="nav-icon" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
          </svg>
          <span class="nav-text">Accueil</span>
        </a>
      </div>
    </nav>

    <!-- CONTENU PRINCIPAL -->
    <main class="main-content">
      
      <div class="header-section">
        <h1 class="page-title">Tableau de bord</h1>
        <p class="page-subtitle">Bienvenue sur votre espace de trading Oro.</p>
      </div>

      <div class="widgets-grid">
        
        <!-- WIDGET GRAPHIQUE -->
        <div class="card widget-chart">
          <div class="card-title">
            <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 013 19.875v-6.75zM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V8.625zM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V4.125z" />
            </svg>
            BTC/USDT
            <span class="live-badge">Live Market</span>
            <button class="icon-btn" id="btn-fullscreen" title="Plein écran">
              <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 3.75v4.5m0-4.5h4.5m-4.5 0L9 9M3.75 20.25v-4.5m0 4.5h4.5m-4.5 0L9 15M20.25 3.75h-4.5m4.5 0v4.5m0-4.5L15 9m5.25 11.25h-4.5m4.5 0v-4.5m0 4.5L15 15" />
              </svg>
            </button>
          </div>
          <div class="chart-price-display" id="chart-price">Chargement...</div>
          <div class="chart-container">
            <canvas id="mainChart"></canvas>
          </div>
        </div>

        <!-- WIDGET MISE A JOUR -->
        <div class="card">
        <div class="card-title">
          <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" />
          </svg>
          Mises à jour système
        </div>
        
        <div id="messages">Initialisation d'Oro...<br></div>
        
        <div class="status-badge" id="app-status">
          <div class="status-dot"></div>
          Système actif
        </div>
      </div>
      </div>

    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
  <script type="module">
    import { listen } from '@tauri-apps/api/event';
    import { getVersion } from '@tauri-apps/api/app';

    const messagesDiv = document.getElementById('messages');

    // Écouter les messages de l'auto-updater depuis le backend Rust
    listen('updater-message', (event) => {
      messagesDiv.innerHTML += event.payload + '<br>';
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    });

    // Afficher la version actuelle
    getVersion().then(version => {
      messagesDiv.innerHTML += 'Version locale : v' + version + '<br>';
    }).catch(console.error);

    // ════════ GRAPHIQUE ════════
    let chartInstance = null;

    async function initChart() {
      const ctx = document.getElementById('mainChart').getContext('2d');
      
      const gradient = ctx.createLinearGradient(0, 0, 0, 300);
      gradient.addColorStop(0, 'rgba(59, 130, 246, 0.25)'); // blue-500
      gradient.addColorStop(1, 'rgba(59, 130, 246, 0)');

      let dataPoints = [];
      let labels = [];
      try {
        const response = await fetch('https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1m&limit=300');
        const data = await response.json();
        dataPoints = data.map(d => parseFloat(d[4]));
        labels = data.map(() => '');
        
        const currentPrice = dataPoints[dataPoints.length - 1];
        document.getElementById('chart-price').innerText = '$' + currentPrice.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
      } catch (e) {
        console.error("Erreur API Binance:", e);
      }

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            data: dataPoints,
            borderColor: '#3b82f6',
            borderWidth: 2.5,
            pointRadius: 0,
            pointHoverRadius: 6,
            pointHoverBackgroundColor: '#3b82f6',
            pointHoverBorderColor: '#fff',
            pointHoverBorderWidth: 2,
            fill: true,
            backgroundColor: gradient,
            tension: 0.4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            zoom: {
              pan: {
                enabled: true,
                mode: 'x',
              },
              zoom: {
                wheel: { enabled: true },
                pinch: { enabled: true },
                mode: 'x',
              }
            },
            tooltip: {
              backgroundColor: '#0f172a',
              titleColor: '#f8fafc',
              bodyColor: '#f8fafc',
              displayColors: false,
              padding: 10,
              callbacks: {
                label: function(context) {
                  return '$' + context.parsed.y.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
                }
              }
            }
          },
          scales: {
            x: { display: false },
            y: {
              grid: { color: '#f1f5f9', drawBorder: false },
              ticks: { color: '#64748b', font: { size: 11 }, callback: v => '$' + v.toLocaleString() }
            }
          },
          interaction: { intersect: false, mode: 'index' }
        }
      });

      // Update en temps réel (toutes les 2.5s)
      setInterval(async () => {
        try {
          const response = await fetch('https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT');
          const data = await response.json();
          const newVal = parseFloat(data.price);
          
          chartInstance.data.datasets[0].data.shift();
          chartInstance.data.datasets[0].data.push(newVal);
          chartInstance.update('none'); // Update without full animation for performance

          document.getElementById('chart-price').innerText = '$' + newVal.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        } catch (e) {}
      }, 2500);
    }

    // Initialiser le graphique
    initChart();

    // Gestion du plein écran
    document.getElementById('btn-fullscreen').addEventListener('click', function() {
      const widget = document.querySelector('.widget-chart');
      widget.classList.toggle('fullscreen-mode');
      
      if (chartInstance) {
        chartInstance.resize();
      }
      
      const isFull = widget.classList.contains('fullscreen-mode');
      this.innerHTML = isFull ? 
        `<svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 9V4.5M9 9H4.5M9 9L3.75 3.75M9 15v4.5M9 15H4.5M9 15l-5.25 5.25M15 9V4.5M15 9h4.5M15 9l5.25-5.25M15 15v4.5M15 15h4.5m-4.5 0l5.25 5.25" /></svg>` : 
        `<svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 3.75v4.5m0-4.5h4.5m-4.5 0L9 9M3.75 20.25v-4.5m0 4.5h4.5m-4.5 0L9 15M20.25 3.75h-4.5m4.5 0v4.5m0-4.5L15 9m5.25 11.25h-4.5m4.5 0v-4.5m0 4.5L15 15" /></svg>`;
    });
  </script>
</body>
</html>
